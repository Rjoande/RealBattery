# On tag push: checks .version == tag, builds a CKAN-friendly zip, and creates the GitHub release
# WITH the zip already attached (so the CKAN bot never sees an asset-less release). If the release
# already exists (e.g. a Draft created by hand and published afterwards), the zip is uploaded to it.
# The built DLLs are committed under GameData/RealBattery/plugin/ (KSP assemblies are not available
# on CI runners, so this packages, it doesn't compile).
#
# Zip layout: GameData/RealBattery, GameData/RealBatteryExpansion, Extras/ (optional patches for
# manual installs; CKAN ignores it), LICENSE. LoadingTipsPlus is NOT bundled (CKAN: recommends).
name: Release zip
on:
  push:
    tags: ['v[0-9]*', '[0-9]*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    env:
      VERSION_FILE: GameData/RealBattery/RealBattery.version
      ZIP_NAME: RealBatteryRecharged
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check .version matches tag
        run: |
          VER="${TAG#v}"
          V=$(python3 -c "import json,re,sys;d=json.loads(re.sub(r',(\s*[}\]])',r'\1',open(sys.argv[1],encoding='utf-8-sig').read()));v=d['VERSION'];print('.'.join(str(v[k]) for k in ('MAJOR','MINOR','PATCH','BUILD') if k in v) if isinstance(v,dict) else v)" "$VERSION_FILE")
          norm(){ echo "$1" | sed -E 's/(\.0)+$//'; }
          [ "$(norm "$V")" = "$(norm "$VER")" ] || { echo "::error::.version VERSION $V != tag $TAG"; exit 1; }
      - name: Check built DLLs are present
        run: |
          test -f GameData/RealBattery/plugin/RealBattery.dll || { echo "::error::RealBattery.dll is not committed"; exit 1; }
      - name: Build zip
        run: |
          VER="${TAG#v}"
          mkdir -p dist
          zip -r -X "dist/${ZIP_NAME}_v${VER}.zip" GameData/RealBattery GameData/RealBatteryExpansion Extras LICENSE \
            -x '*.pdb' '*.mdb' '*/Thumbs.db' '*/.DS_Store' '*/desktop.ini' '*/_migration_manifest.md'
          unzip -l "dist/${ZIP_NAME}_v${VER}.zip"
      - name: Create release or upload asset
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --title "$TAG" --generate-notes
          fi
