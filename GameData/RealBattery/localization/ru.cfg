        // === Difficulty Settings === //

        #LOC_RB_Settings_Tab_Simulation = Симуляция
        #LOC_RB_Settings_Tab_Advanced = Расширенные настройки
        #LOC_RB_Settings_Tab_Debug = Инструменты разработчика

        #LOC_RB_Settings_SelfDischarge = Включить саморазряд
        #LOC_RB_Settings_SelfDischarge_desc = Аккумуляторы будут медленно терять заряд со временем, пока их не используют.

        #LOC_RB_Settings_BatteryWear = Включить деградацию аккумуляторов
        #LOC_RB_Settings_BatteryWear_desc = Аккумуляторы будут медленно изнашиваться с каждым циклом заряда и разряда.

        #LOC_RB_Settings_HeatProduction = Включить выделение тепла
        #LOC_RB_Settings_HeatProduction_tip = Аккумуляторы выделяют тепло при заряде или разряде. Перегрев ускоряет деградацию аккумуляторов.

        #LOC_RB_Settings_UseSystemHeat = Использовать SystemHeat
        #LOC_RB_Settings_UseSystemHeat_tip = Направлять тепло от аккумуляторов через SystemHeat вместо стоковой тепловой модели. Требуется установленный SystemHeat.

        #LOC_RB_Settings_CryoWHM = Режим избыточного тепла
        #LOC_RB_Settings_CryoWHM_tip = Криогенные батареи будут производить избыточное тепло через SystemHeat вместо потребления электроэнергии для поддержания температуры (аналогично криогенным бакам из CryoTanks).

        #LOC_RB_Settings_CosmeticToasts = Отображение сообщений
        #LOC_RB_Settings_CosmeticToasts_tip = Показывать сообщения о истощении аккумуляторов, их перегреве и т.п. Предупреждения о износе батарей и их тепловом разгоне видны вне зависимости от настройки.

        #LOC_RB_Settings_LowPowerAlarm = Тревога о низком заряде
        #LOC_RB_Settings_LowPowerAlarm_tip = Отправлять предупреждение о заканчивающемся заряде на незагруженном аппарате.

        #LOC_RB_Settings_UseKAC = Использовать Kerbal Alarm Clock
        #LOC_RB_Settings_UseKAC_tip = Создавать тревоги о низком заряде через KAC вместо стокового будильника (переключение этой опции удалит любые действующие тревоги RealBattery).

        #LOC_RB_Settings_LowPowerMinWindow = Минимальное окно оповещений (минуты)
        #LOC_RB_Settings_LowPowerMinWindow_tip = Не создавать оповещения, если расчётное время полной разрядки меньше этого значения.

        #LOC_RB_Settings_LowPowerLead = Время упреждения оповещений (минуты)
        #LOC_RB_Settings_LowPowerLead_tip = За сколько минут до полной разрядки должно срабатывать оповещение.

        #LOC_RB_Set_EnableEVARefurbish = Включить обслуживание в полете
        #LOC_RB_Set_EnableEVARefurbish_desc = Позволяет инженерам во время ВКД полностью заменять аккумуляторы при помощи запасных частей.

        #LOC_RB_Settings_ThermalRunaway = Реалистичный тепловой разгон
        #LOC_RB_Settings_ThermalRunaway_tip = Если включено, аккумуляторы при тепловом разгоне будут нагреваться даже после их отключения.

        #LOC_RB_Settings_KeepWarmFrac = Поддержание температуры аккумуляторов
        #LOC_RB_Settings_KeepWarmFrac_tip = Часть энергии при разряде батарей КЭРБ будет направлена на их поддержание их температуры.

        #LOC_RB_Settings_RunawayMagnitude_title = Интенсивность теплового разгона
        #LOC_RB_Settings_RunawayMagnitude_desc = Определяет, насколько быстро будет происходить тепловой разгон и насколько сильными будут его эффекты.

        #LOC_RB_Settings_SelfRunawayMultiplier = Множитель случайного теплового разгона
        #LOC_RB_Settings_SelfRunawayMultiplier_tip = Определяет шанс спонтанного теплового разгона. 1.0 = номинальный; 0 = выключен. Затрагивает лишь аккумуляторы с радиоактивными веществами.

        #LOC_RB_Settings_SelfRunawayBG = Разрешить Р.И.П. случаться в фоновом режиме
        #LOC_RB_Settings_SelfRunawayBG_tip = Если включено, ядерные аккумуляторы могут случайно дать сбой на незагруженных аппаратах. Выключите, чтобы предотвратить неожиданный выход аккумулятора из строя при ускорении времени.

        #LOC_RB_Settings_PolarThreshold = Порог полярной широты
        #LOC_RB_Settings_PolarThreshold_tip = При посадке/приводнении аппарата выше этой широты выработка солнечных панелей в фоновом режиме считается постоянной, без смены дня и ночи.

        #LOC_RB_Settings_PolarFrac = Эффективность солнечных панелей в полярных широтах
        #LOC_RB_Settings_PolarFrac_tip = Средняя доля мощности солнечных панелей при посадке/приводнении на полюсах (± 90° широты).

        #LOC_RB_DayLenght = Продолжительность светового дня (в часах)
        #LOC_RB_DayLenght_desc = 0: Автоматически (Кербин / родная планета). В противном случае будет использоваться выбранное значение (1-24).

        #LOC_RB_DeepSpaceProtection = Защита от глубокого космоса
        #LOC_RB_DeepSpaceProtection_tip = Уменьшает износ аккумуляторов в полетах по глубокому космосеу путём подавления буферного заряда в фоновом режиме.
        
        #LOC_RB_DisablePCM = Отключить PCM
        #LOC_RB_DisablePCM_desc = Если включено, автоматический предохранитель больше не будет выключать аккумуляторы, приближающиеся к перегреву.

        #LOC_RB_DisableBackgroundSim = Выключить симуляцию в фоновом режиме
        #LOC_RB_DisableBackgroundSim_tip = Аккумуляторы незагруженных аппаратов не будут заряжаться, разряжаться, изнашиваться или не испытывать эффекты теплового разгона.

        #LOC_RB_Log = Включить отладочные логи
        #LOC_RB_Log_desc = Включить подробные отладочные логи.

        #LOC_RB_VerboseLog = Включить логи рантаймов
        #LOC_RB_VerboseLog_desc = Включить подробное логирование во время выполнения (используйте только для сообщения об ошибках, может засорять логи).

        
