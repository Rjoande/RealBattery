        #LOC_RB_descDet_decal_Li_poly = - <b>НЕ СГИБАТЬ,</b> не сжимать и не провоцировать вздутие.\n- <b>ИЗБЕГАТЬ ЧРЕЗМЕРНОГО НАГРЕВА,</b> холода или любопытства.\n- <b>ИЗБЫТОЧНЫЙ ИЛИ НУЛЕВОЙ ЗАРЯД</b> может вызвать необратимую потерю мощности и целостности.\n- Не хранить под давлением, рядом с топливными магистралями или внутри отсеков для закусок.
        #LOC_RB_descDet_decal_Graphene = - <b>ВНИМАНИЕ:</b> не может использоваться как тепловой щит (мы уже пробовали).\n- <b>ИЗБЕГАТЬ КОНТАКТА С КОЖЕЙ</b> во время работы.\n- <b>УТИЛИЗИРОВАТЬ ЧЕРЕЗ СЕРТИФИЦИРОВАННЫЙ ПЕРЕРАБАТЫВАЮЩИЙ ЦЕНТР:</b> несанкционированное обращение аннулирует гарантию. Возврат денег не производится.\n- Убедитесь, что проводка и предохранители выдерживают полный скачок напряжения.
