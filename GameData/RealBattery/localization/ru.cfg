        // === Alarms / Messages === //

        #LOC_RB_DeplAlarmTitle = Разряжающиеся батареи на <<1>>.

        #LOC_RB_DeplToastMsg = Скоро на аппарате <<1>> кончится энергия!

        #LOC_RB_DeplToastMsg_A = Мы потеряли контакт с <<1>>. Возможно, кто-то не выключил там утюг. Наверное, пора взглянуть.
