// Optional "No battery" subtype for crewed parts and command parts (issue #22).
// Applies only to parts that already have a RealBattery chemistry switch, so
// single-chemistry parts (mostly historical replicas) keep their battery.
// Runs AFTER the zzz_RealBattery pass so the generic catch-alls are included.
// The subtype has no tankType: B9PS falls back to its empty structural tank,
// removing ElectricCharge and StoredCharge along with their mass and cost.

// Crewed parts
@PART:HAS[#CrewCapacity[>0],@MODULE[RealBattery],@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[batterySwitch]],!MODULE[RB_ignore]]:AFTER[zzz_RealBattery]
{
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[batterySwitch],!SUBTYPE[NoBattery]]
    {
        SUBTYPE
        {
            name = NoBattery
            title = #LOC_RB_title_NoBattery
            descriptionSummary = #LOC_RB_descSum_NoBattery
            descriptionDetail = #LOC_RB_descDet_NoBattery
            defaultSubtypePriority = -1 // never the default, even in early career
            MODULE
            {
                IDENTIFIER
                {
                    name = RealBattery
                }
                DATA
                {
                    moduleActive = false
                    EVAupgrade = none
                }
            }
        }
    }
}

// Probe cores and other command parts (the !SUBTYPE guard skips parts already handled above)
@PART:HAS[@MODULE[ModuleCommand],@MODULE[RealBattery],@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[batterySwitch]],!MODULE[RB_ignore]]:AFTER[zzz_RealBattery]
{
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[batterySwitch],!SUBTYPE[NoBattery]]
    {
        SUBTYPE
        {
            name = NoBattery
            title = #LOC_RB_title_NoBattery
            descriptionSummary = #LOC_RB_descSum_NoBattery
            descriptionDetail = #LOC_RB_descDet_NoBattery
            defaultSubtypePriority = -1 // never the default, even in early career
            MODULE
            {
                IDENTIFIER
                {
                    name = RealBattery
                }
                DATA
                {
                    moduleActive = false
                    EVAupgrade = none
                }
            }
        }
    }
}
