// RB_ignore opt-out list. Every part listed here gets a marker MODULE that every
// RealBattery-adding patch checks for via "!HAS[@MODULE[RB_ignore]]" and skips.
// Runs at :FIRST[RealBattery], before any :FOR[zzz_RealBattery] patch, so the
// marker is already present when those patches evaluate their HAS[] filters.
//
// Use "|" (OR) between part names, never "," (AND) — a typo in a comma-joined
// list would silently narrow the exclusion to parts matching ALL the listed
// names instead of ANY of them.
//
// - USEVAX (Universal Storage 2): nuclear reactor part; EC-only, must stay a
//   generator, not become a battery.
// - KF-APU (Kerbal Foundries): auxiliary power unit; EC-only, must stay a
//   generator, not become a battery.
@PART[USEVAX,KF-APU]:BEFORE[RealBattery]
{
    MODULE
    {
        name = RB_ignore
    }
}
