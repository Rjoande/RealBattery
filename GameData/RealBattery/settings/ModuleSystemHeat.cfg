@PART:HAS[@MODULE[RealBattery],#RBbaseVolume]:NEEDS[SystemHeat]
{
    MODULE
    {
        name = ModuleSystemHeat
        // ModuleSystemHeat.volume is NOT a physical/cargo volume: it directly sets the loop's
        // thermal mass in SystemHeat's own simulation (deltaT = flux / (volume * density *
        // heatCapacity) — see HeatLoop.cs), and is summed additively across every module sharing
        // a loop. The wider SystemHeat ecosystem (CryoTanks, SystemHeatConverters/Harvesters)
        // ties this to part MASS (e.g. CryoTanks: volume = mass * 0.5), not storage capacity.
        // RB uses RBbaseVolume (energy storage capacity, unrelated to thermal mass) as a
        // practical stand-in — MM patches can't reliably read a B9PS subtype's resolved mass,
        // since mass varies per subtype and isn't available at patch time. The 0.0003 factor
        // (vs. a naive 0.001 L->m3 conversion) is an empirical correction: a 1200 L RB SMES vs. a
        // matched 1200 L CryoTanks LH2 tank measured loop volumes of 1.2 m3 vs 0.38 m3
        // respectively (T3b protocol, 2026-07-15) — 1200 * 0.0003 = 0.36 m3, within 5% of the
        // CryoTanks reference. Same correction applied uniformly to all RB chemistries.
        volume = #$../RBbaseVolume$
        @volume *= 0.0003
        moduleID = ModuleSystemHeatRealBattery
        iconName = Icon_Gears
    }
}