// Bay R2 (BMS, renamed from "BATT" 2026-08-27) content for the MFD Extended shared MAS monitor (host project
// "MFDExtension" — see its own HOSTING.md and notes/NOTES_IVA_MFD_SharedFramework.md
// for the full background/design history). Owned and shipped by RealBattery
// itself, not by the host: MFDExtension only supplies the "not installed"
// fallback variant of this same page name (gated NEEDS[!RealBattery], so
// exactly one of the two ever loads) and the button-R2 routing.
//
// The MASMonitor `page =` registration ships HERE, next to the page, under
// the same NEEDS — contract revised 2026-08-19: a name registered in that
// list with no MAS_PAGE behind it makes MASMonitor.Start() throw and the
// whole monitor black-screen (confirmed in game, Player.log), so only the
// repo that guarantees the page's existence may register it. The host
// registers its own fallback under NEEDS[!RealBattery]; we register the
// real page here. Keeping both nodes in this one file means the pair can
// never desync.
//
// NEEDS[AvionicsSystems&MFDExtension]: this node is meaningless without
// both the MAS runtime and the host framework present, even though the
// file only ships with RealBattery anyway (so no NEEDS[RealBattery] guard
// is needed here).
//
// Step 1 (hello-world) confirmed working in game 2026-08-19 — superseded below
// by the real BATT (active vessel, per-battery detail) content. FLEET, added
// 2026-08-30, is its own MAS_PAGE (MFDExt_BATT_Fleet) below — a MAS_PAGE that
// isn't in MASMonitor's own page = list is unreachable no matter how it's wired
// (see HOSTING.md), so it gets registered right alongside MFDExt_BATT in the
// same @PROP patch at the bottom of this file.
//
// EPS, added 2026-09-15, is a third MAS_PAGE (MFDExt_BATT_EPS) and is now the bay's
// entry page — the button cycle was extended from BATT<->FLEET to EPS->BATT->FLEET->EPS
// (MFDExtension host side; see MFDExt_BATT_Nav.lua for the three-entry override chain
// this requires). The C# methods that used to be named GetL1Text/GetL2Text (and every
// other L1/L2-suffixed helper) were renamed to GetBattText/GetFleetText etc. at the
// same time, since "L1"/"L2" no longer matches the real cycle order.
//
// Page navigation is a same-repo concern, not a host change: pressing the bay's own
// button (R2/BMS) again while on any of the three pages advances to the next one via
// the MFDExt_OwnButtonOverrides hooks in MFDExt_BATT_Nav.lua (same folder) — there is
// no reliance on MFDExt_Redirect's own default behavior anymore now that every page in
// the cycle has its own explicit override.
//
// Content comes from RealBatteryMFDProvider (source/Core/RealBatteryMFDProvider.cs),
// an InternalModule bridged the same way MAS itself bridges RPM PAGEHANDLER classes
// (DPAI_RPM:getPageText, InternalVesselView:ShowMenu — see GameData/MOARdV/MFD and
// GameData/MOARdV/MAS_JSI/MFDPages in the dev workspace for verified precedent):
// `textmethod = ClassName:MethodName` on a TEXT node, method signature
// `string Method(int screenWidth, int screenHeight)` in character columns/rows
// (40x20 on this prop), same convention as RPM's own PAGEHANDLER. Color comes from
// MAS's own inline `[#RRGGBB]` tags baked directly into the returned string
// (confirmed real syntax against GameData/MOARdV/MFD/MFD2_Plan.cfg) — no separate
// colored TEXT nodes, no $&$ template substitution (that's only for MAS's own
// `text = ...` field, not used here).
//
// Like RPM_MODULE, MAS does not auto-instantiate a textmethod target — it must
// also be added as a plain sibling MODULE on the prop (see the @PROP patch below).
//
// List-scroll/home softkeys (2026-08-30): BATT and FLEET each also carry a button-only
// RPM_MODULE (no renderMethod/renderSize — coexists with the TEXT/textmethod node above,
// which already renders the page) whose buttonClickMethod scrolls that page's own list.
// Same mechanism and same physical button ids (button_UP=0, button_DOWN=1, button_HOME=4)
// as MFDExtension's own CAS bay (Pages/MFDExt_CAS.cfg + src/Cas/MFDExtCasModule.cs — read
// directly from that real, working implementation, not guessed). BATT and FLEET point at
// different buttonClickMethod names (ButtonProcessorBatt/Fleet) on the same
// RealBatteryMFDProvider instance so each page scrolls its own list without needing to
// track "which page is active" by hand. EPS has no RPM_MODULE yet — its placeholder
// content is fixed-size, nothing to scroll (see GetEpsText's own header comment).

// EPS — vessel-wide power summary (see header note above). New entry page, 2026-09-15.
// Same RealBatteryMFDProvider instance, same textmethod bridge, different method.
// Placeholder content for now, layout still pending.
MAS_PAGE:NEEDS[AvionicsSystems&MFDExtension]
{
	name = MFDExt_BATT_EPS

	TEXT
	{
		name = EPS content
		position = 0, 0
		textmethod = RealBatteryMFDProvider:GetEpsText
	}

	// NEXT (R9, softkey 7) / PREV (R10, softkey 8) cycle the three BMS pages, independent of
	// the bay-button cycle in MFDExt_BATT_Nav.lua. A page softkey is consumed before the
	// RPM_MODULE bridge, so 7/8 never reach ButtonProcessor*. Not in the on-screen legend.
	softkey = 7, fc.SetPersistent("%AUTOID%", "MFDExt_BATT")
	softkey = 8, fc.SetPersistent("%AUTOID%", "MFDExt_BATT_Fleet")
}

MAS_PAGE:NEEDS[AvionicsSystems&MFDExtension]
{
	name = MFDExt_BATT

	TEXT
	{
		name = BATT content
		position = 0, 0
		textmethod = RealBatteryMFDProvider:GetBattText
	}

	RPM_MODULE
	{
		moduleName = RealBatteryMFDProvider
		buttonClickMethod = ButtonProcessorBatt
	}

	// NEXT (R9, softkey 7) / PREV (R10, softkey 8) cycle the three BMS pages, independent of
	// the bay-button cycle in MFDExt_BATT_Nav.lua. A page softkey is consumed before the
	// RPM_MODULE bridge, so 7/8 never reach ButtonProcessor*. Not in the on-screen legend.
	softkey = 7, fc.SetPersistent("%AUTOID%", "MFDExt_BATT_Fleet")
	softkey = 8, fc.SetPersistent("%AUTOID%", "MFDExt_BATT_EPS")
}

// FLEET — fleet overview (see header note above). Same RealBatteryMFDProvider instance,
// same textmethod bridge, different method. Read-only for now: no MENU/selection node,
// see GetFleetText's own header comment for why.
MAS_PAGE:NEEDS[AvionicsSystems&MFDExtension]
{
	name = MFDExt_BATT_Fleet

	TEXT
	{
		name = FLEET content
		position = 0, 0
		textmethod = RealBatteryMFDProvider:GetFleetText
	}

	RPM_MODULE
	{
		moduleName = RealBatteryMFDProvider
		buttonClickMethod = ButtonProcessorFleet
	}

	// NEXT (R9, softkey 7) / PREV (R10, softkey 8) cycle the three BMS pages, independent of
	// the bay-button cycle in MFDExt_BATT_Nav.lua. A page softkey is consumed before the
	// RPM_MODULE bridge, so 7/8 never reach ButtonProcessor*. Not in the on-screen legend.
	softkey = 7, fc.SetPersistent("%AUTOID%", "MFDExt_BATT_EPS")
	softkey = 8, fc.SetPersistent("%AUTOID%", "MFDExt_BATT")
}

MAS_LUA
{
	name = RealBattery_MFDNav
	script = RealBattery/MFDExtension/MFDExt_BATT_Nav.lua
}

@PROP[MAS_JSI_BasicMFD]:NEEDS[AvionicsSystems&MFDExtension]:FINAL
{
	@MODULE[MASMonitor]
	{
		page = MFDExt_BATT_EPS
		page = MFDExt_BATT
		page = MFDExt_BATT_Fleet
	}

	MODULE
	{
		name = RealBatteryMFDProvider
		// Explicit even though they match the fields' own C# defaults — same
		// self-documenting convention MFDExtension itself uses for MFDExtCasModule's
		// buttonUp/buttonDown/buttonHome (Config/Additive/MAS_BasicMFD.cfg §5).
		buttonUp = 0
		buttonDown = 1
		buttonHome = 4
	}
}
